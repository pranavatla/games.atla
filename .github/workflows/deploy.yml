name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Short-lived credentials from GitHub's OIDC token: no stored AWS keys. The role
      # trusts only this repository's deploy branch and can only publish this site.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::361739112666:role/github-deploy-games-atla
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy launcher (root index)
        run: |
          aws s3 cp deploy/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --content-type "text/html" \
            --cache-control "public, max-age=60"

      - name: Deploy Drop game
        run: |
          aws s3 sync deploy/drop/ s3://${{ secrets.S3_BUCKET }}/drop/ \
            --delete \
            --content-type "text/html" \
            --cache-control "public, max-age=60"

      - name: Deploy Invaders game
        run: |
          aws s3 sync deploy/invaders/ s3://${{ secrets.S3_BUCKET }}/invaders/ \
            --delete \
            --content-type "text/html" \
            --cache-control "public, max-age=60"

      - name: Deploy Break game
        run: |
          aws s3 sync deploy/break/ s3://${{ secrets.S3_BUCKET }}/break/ \
            --delete \
            --content-type "text/html" \
            --cache-control "public, max-age=60"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Done
        run: echo "Deployed to https://games.atla.in"
